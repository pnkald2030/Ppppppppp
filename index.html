<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دليل كيمو التجاري</title>
    <!-- مكتبة Supabase للربط السحابي -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-secondary: #64748b;
            --border: #cbd5e1;
            --danger: #dc2626;
            --success: #16a34a;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }
        header {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            padding: 2rem 1rem;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        header h1 {
            margin: 0 0 0.5rem 0;
            font-size: 2rem;
        }
        header p {
            margin: 0;
            opacity: 0.9;
        }
        .container {
            max-width: 1000px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .search-box {
            flex: 1;
            min-width: 250px;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-box:focus {
            border-color: var(--primary);
        }
        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: var(--primary-dark);
        }
        .btn-danger {
            background-color: var(--danger);
        }
        .btn-danger:hover {
            background-color: #b91c1c;
        }
        /* لوحة التحكم (المودال) */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 1rem;
            box-sizing: border-box;
        }
        .modal-content {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.2);
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-content h2 {
            margin-top: 0;
            color: var(--primary);
        }
        .form-group {
            margin-bottom: 1rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
        }
        .form-group textarea {
            resize: vertical;
            height: 100px;
        }
        /* شبكة الأنشطة التجارية */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            border: 1px solid #e2e8f0;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .card h3 {
            margin: 0 0 0.5rem 0;
            color: var(--text-main);
            font-size: 1.25rem;
        }
        .badge {
            display: inline-block;
            background: #eff6ff;
            color: var(--primary);
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 1rem;
        }
        .card p {
            margin: 0.25rem 0;
            color: var(--text-secondary);
            font-size: 0.95rem;
        }
        .card-footer {
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid #f1f5f9;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .phone-link {
            color: var(--success);
            font-weight: bold;
            text-decoration: none;
        }
        .delete-btn {
            background: none;
            border: none;
            color: var(--danger);
            cursor: pointer;
            font-size: 0.9rem;
            display: none;
        }
        .admin-mode .delete-btn {
            display: inline-block;
        }
        .no-data {
            text-align: center;
            grid-column: 1 / -1;
            color: var(--text-secondary);
            padding: 3rem;
            font-size: 1.1rem;
        }
    </style>
</head>
<body id="body">

    <header>
        <h1>دليل كيمو التجاري</h1>
        <p>دليلك الشامل للأنشطة والخدمات التجارية</p>
        <div style="margin-top: 1rem;">
            <button class="btn" onclick="checkAdminAccess()" id="adminBtn" style="background: rgba(255,255,255,0.2); font-size: 0.9rem;">لوحة المالك 🔐</button>
        </div>
    </header>

    <div class="container">
        <div class="controls">
            <input type="text" id="searchInput" class="search-box" placeholder="ابحث عن نشاط، تصنيف، أو مدينة..." oninput="filterBusinesses()">
        </div>

        <div id="businessesGrid" class="grid">
            <div class="no-data">جاري تحميل الأنشطة التجارية...</div>
        </div>
    </div>

    <!-- نافذة تسجيل دخول المالك -->
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <h2>تسجيل دخول المالك</h2>
            <div class="form-group">
                <label>اسم المستخدم</label>
                <input type="text" id="usernameInput">
            </div>
            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" id="passwordInput">
            </div>
            <div style="display: flex; gap: 1rem; justify-content: flex-end; margin-top: 1.5rem;">
                <button class="btn" style="background-color: var(--text-secondary);" onclick="closeModals()">إلغاء</button>
                <button class="btn" onclick="verifyLogin()">دخول</button>
            </div>
        </div>
    </div>

    <!-- نافذة إضافة نشاط تجاري جديد -->
    <div id="addModal" class="modal">
        <div class="modal-content">
            <h2>إضافة نشاط تجاري جديد (لوحة المالك)</h2>
            <form id="addForm" onsubmit="addBusiness(event)">
                <div class="form-group">
                    <label>اسم النشاط التجاري *</label>
                    <input type="text" id="title" required>
                </div>
                <div class="form-group">
                    <label>التصنيف *</label>
                    <input type="text" id="category" placeholder="مثال: مطاعم، صيانة، ملابس..." required>
                </div>
                <div class="form-group">
                    <label>المدينة</label>
                    <input type="text" id="city" placeholder="مثال: صنعاء، إب، تعز...">
                </div>
                <div class="form-group">
                    <label>الحي / الشارع</label>
                    <input type="text" id="district">
                </div>
                <div class="form-group">
                    <label>رقم الهاتف</label>
                    <input type="text" id="phone">
                </div>
                <div class="form-group">
                    <label>تفاصيل الخدمات أو الوجبات</label>
                    <textarea id="description" placeholder="اكتب نبذة أو تفاصيل عن النشاط..."></textarea>
                </div>
                <div class="form-group">
                    <label>اسم صاحب النشاط</label>
                    <input type="text" id="owner_name">
                </div>
                <div style="display: flex; gap: 1rem; justify-content: flex-end; margin-top: 1.5rem;">
                    <button type="button" class="btn" style="background-color: var(--text-secondary);" onclick="closeModals()">إغلاق</button>
                    <button type="submit" class="btn" style="background-color: var(--success);">حفظ وإضافة النشاط ➕</button>
                </div>
            </form>
            <div style="margin-top: 2rem; border-top: 1px solid var(--border); pt: 1rem;">
                <button class="btn btn-danger" style="width: 100%; margin-top: 1rem;" onclick="logoutAdmin()">تسجيل خروج المالك 🚪</button>
            </div>
        </div>
    </div>

    <script>
        // إعدادات اتصال Supabase
        const SUPABASE_URL = 'https://ahctznfsxvzzjaddjbm.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFoY3R6bmZzeHZ6emphZGRqYm0iLCJyb2xlIjoiYW5vbiIsImlhdCI6MTczOTQ0NDMyMSwiZXhwIjoyMDU1MDE0MzIxfQ.vE9RPrO_2H7zW1Xq7P5oZ9W1Y2X3Q4W5E6R7T8Y9U0I'; // المفتاح العام الآمن
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let allBusinesses = [];

        // التحقق من حالة الدخول عند تحميل الصفحة
        document.addEventListener("DOMContentLoaded", () => {
            checkSessionPersistence();
            fetchBusinesses();
        });

        async function fetchBusinesses() {
            const grid = document.getElementById('businessesGrid');
            const { data, error } = await supabaseClient
                .from('businesses')
                .select('*')
                .order('id', { ascending: false });

            if (error) {
                grid.innerHTML = `<div class="no-data" style="color: var(--danger);">خطأ في الاتصال بقاعدة البيانات: ${error.message}</div>`;
                return;
            }

            allBusinesses = data || [];
            renderBusinesses(allBusinesses);
        }

        function renderBusinesses(items) {
            const grid = document.getElementById('businessesGrid');
            if (items.length === 0) {
                grid.innerHTML = `<div class="no-data">لا توجد أنشطة تجارية مضافة حتى الآن.</div>`;
                return;
            }

            grid.innerHTML = items.map(item => `
                <div class="card">
                    <div>
                        <span class="badge">${item.category || 'عام'}</span>
                        <h3>${item.title || 'بدون اسم'}</h3>
                        <p>📍 ${item.city || 'غيرحدد'} ${item.district ? '- ' + item.district : ''}</p>
                        <p style="margin-top: 0.5rem;">${item.description || ''}</p>
                    </div>
                    <div class="card-footer">
                        <div>
                            ${item.phone ? `<a href="tel:${item.phone}" class="phone-link">📞 ${item.phone}</a>` : '<span></span>'}
                            ${item.owner_name ? `<p style="font-size: 0.8rem; color: var(--text-secondary); margin: 0;">المالك: ${item.owner_name}</p>` : ''}
                        </div>
                        <button class="delete-btn" onclick="deleteBusiness(${item.id})">حذف 🗑️</button>
                    </div>
                </div>
            `).join('');
            
            updateAdminUI();
        }

        function filterBusinesses() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allBusinesses.filter(item => 
                (item.title && item.title.toLowerCase().includes(query)) ||
                (item.category && item.category.toLowerCase().includes(query)) ||
                (item.city && item.city.toLowerCase().includes(query)) ||
                (item.description && item.description.toLowerCase().includes(query))
            );
            renderBusinesses(filtered);
        }

        function checkAdminAccess() {
            const isAdmin = localStorage.getItem('kemo_admin') === 'true';
            if (isAdmin) {
                document.getElementById('addModal').style.display = 'flex';
            } else {
                document.getElementById('loginModal').style.display = 'flex';
            }
        }

        function verifyLogin() {
            const user = document.getElementById('usernameInput').value;
            const pass = document.getElementById('passwordInput').value;
            if (user === '2001' && pass === '203096qq') {
                localStorage.setItem('kemo_admin', 'true');
                closeModals();
                document.getElementById('addModal').style.display = 'flex';
                updateAdminUI();
                alert('تم تسجيل الدخول بنجاح كمالك للموقع!');
            } else {
                alert('اسم المستخدم أو كلمة المرور غير صحيحة!');
            }
        }

        function logoutAdmin() {
            localStorage.removeItem('kemo_admin');
            closeModals();
            updateAdminUI();
            alert('تم تسجيل الخروج بنجاح.');
        }

        function checkSessionPersistence() {
            updateAdminUI();
        }

        function updateAdminUI() {
            const isAdmin = localStorage.getItem('kemo_admin') === 'true';
            if (isAdmin) {
                document.getElementById('body').classList.add('admin-mode');
                document.getElementById('adminBtn').innerText = 'لوحة التحكم (نشطة) 🔓';
            } else {
                document.getElementById('body').classList.remove('admin-mode');
                document.getElementById('adminBtn').innerText = 'لوحة المالك 🔐';
            }
        }

        function closeModals() {
            document.getElementById('loginModal').style.display = 'none';
            document.getElementById('addModal').style.display = 'none';
        }

        async function addBusiness(e) {
            e.preventDefault();
            const newBiz = {
                title: document.getElementById('title').value,
                category: document.getElementById('category').value,
                city: document.getElementById('city').value,
                district: document.getElementById('district').value,
                phone: document.getElementById('phone').value,
                description: document.getElementById('description').value,
                owner_name: document.getElementById('owner_name').value
            };

            const { data, error } = await supabaseClient
                .from('businesses')
                .insert([newBiz]);

            if (error) {
                alert('حدث خطأ أثناء الحفظ: ' + error.message);
                return;
            }

            alert('تم إضافة النشاط التجاري بنجاح!');
            document.getElementById('addForm').reset();
            closeModals();
            fetchBusinesses();
        }

        async function deleteBusiness(id) {
            if (!confirm('هل أنت متأكد من حذف هذا النشاط التجاري؟')) return;

            const { error } = await supabaseClient
                .from('businesses')
                .delete()
                .eq('id', id);

            if (error) {
                alert('حدث خطأ أثناء الحذف: ' + error.message);
                return;
            }

            alert('تم الحذف بنجاح.');
            fetchBusinesses();
        }
    </script>
</body>
</html>
